name: Build and publish

on:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: git archive --format=zip --output=source.zip HEAD
      - run: npm ci
      - run: npm run build
      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: |
            dist/*.zip
            source.zip

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archives

      - name: Get zip path
        run: echo "ZIP_CHROME=dist/$(ls dist | grep chrome)" >> $GITHUB_ENV

      - uses: wdzeng/chrome-extension@v2
        with:
          action: upload
          extension-id: jepfhfjlkgobooomdgpcjikalfpcldmm
          zip-path: ${{ env.ZIP_CHROME }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archives

      - name: Get zip path
        run: echo "ZIP_FF=dist/$(ls dist | grep firefox)" >> $GITHUB_ENV

      - uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: '{7c45e7c9-80ff-4f7f-93b3-da64baf0c6dd}'
          xpi-path: ${{ env.ZIP_FF }}
          self-hosted: false
          source-file-path: source.zip
          jwt-issuer: ${{ secrets.FF_ISSUER }}
          jwt-secret: ${{ secrets.FF_SECRET }}
